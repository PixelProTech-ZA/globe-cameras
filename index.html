    <!--
      Companion to 404.html: if this page was reached via the 404.html
      redirect (i.e. the URL has a "?/..." query segment encoding the
      original deep-link path), restore that real path with
      history.replaceState before React Router initializes, so it sees
      /globe-cameras/about instead of /globe-cameras/?/about.
      Runs only when the redirect query marker is present; does nothing
      on normal navigation.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          );
        }
      })();
    </script>
