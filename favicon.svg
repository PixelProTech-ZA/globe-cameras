<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="108" fill="#0A0A0F"/>

  <!-- globe meridians -->
  <g stroke="#2A2A40" stroke-width="6" fill="none">
    <circle cx="256" cy="256" r="150"/>
    <ellipse cx="256" cy="256" rx="62" ry="150"/>
    <ellipse cx="256" cy="256" rx="150" ry="62"/>
  </g>

  <!-- outer aperture ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- camera iris blades -->
  <g fill="#00D4AA">
    <circle cx="256" cy="256" r="10"/>
  </g>
  <g fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round">
    <path d="M256 256 L256 176"/>
    <path d="M256 256 L326 296"/>
    <path d="M256 256 L186 296"/>
  </g>

  <!-- camera location pin marker, off-axis -->
  <circle cx="366" cy="150" r="16" fill="#7B2FFF"/>
  <circle cx="366" cy="150" r="6" fill="#0A0A0F"/>
</svg>
